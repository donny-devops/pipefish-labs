# PipeFish Labs — Production WireGuard VPN Mesh Configuration
# Connects geographically distributed agent worker nodes over encrypted UDP tunnel

[Interface]
# Node IP on isolated mesh overlay network
Address = 10.200.0.1/24
PrivateKey = {{PQC_NODE_WIREGUARD_PRIVATE_KEY}}
ListenPort = 51820
MTU = 1420
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Peer: Secondary Execution Enclave (AWS Nitro)
[Peer]
PublicKey = {{PEER_AWS_NITRO_PUBLIC_KEY}}
PresharedKey = {{PQC_PRESHARED_QUANTUM_RESISTANT_KEY}}
AllowedIPs = 10.200.0.2/32
Endpoint = 198.51.100.10:51820
PersistentKeepalive = 25

# Peer: Bare-Metal GPU Inference Node (Hetzner / CoreWeave)
[Peer]
PublicKey = {{PEER_GPU_INFERENCE_PUBLIC_KEY}}
PresharedKey = {{PQC_PRESHARED_QUANTUM_RESISTANT_KEY}}
AllowedIPs = 10.200.0.3/32
Endpoint = 203.0.113.25:51820
PersistentKeepalive = 25
