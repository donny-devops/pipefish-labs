# PipeFish Labs — Production Envoy Gateway & Load Balancer Configuration
# Features: Token Bucket Rate Limiting, Active Health Checking, Circuit Breaking, Round-Robin Balancing

static_resources:
  listeners:
    - name: agent_mesh_ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: pipefish_api
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: agent_mesh_cluster
                            timeout: 15s
                            retry_policy:
                              retry_on: "5xx,connect-failure,refused-stream"
                              num_retries: 3
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: agent_mesh_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 0.5s

      # 1. Circuit Breaking Protections
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1024
            max_pending_requests: 500
            max_requests: 2000
            max_retries: 3

      # 2. Active Health Checking
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: "/health"

      load_assignment:
        cluster_name: agent_mesh_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8001
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8002
