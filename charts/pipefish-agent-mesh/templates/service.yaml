apiVersion: v1
kind: Service
metadata:
  name: {{ include "pipefish.fullname" . | default "pipefish-agent-mesh" }}
  labels:
    app.kubernetes.io/name: pipefish-agent-mesh
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: mcp
  selector:
    app.kubernetes.io/name: pipefish-agent-mesh
    app.kubernetes.io/instance: {{ .Release.Name }}
