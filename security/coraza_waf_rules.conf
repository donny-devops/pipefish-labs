# PipeFish Labs — Coraza / OWASP CRS Web Application Firewall Rules
# Enforces input validation and cryptographic signature headers for AI Agent APIs

# Rule 1: Require HMAC-SHA256 or Ed25519 Webhook Signature Header
SecRule REQUEST_URI "@beginsWith /v1/webhooks/" \
    "id:100001,phase:1,deny,status:401,log,msg:'Missing X-PipeFish-Signature header on webhook endpoint'" \
    "chain"
    SecRule &REQUEST_HEADERS:X-PipeFish-Signature "@eq 0"

# Rule 2: Webhook Timestamp Drift Tolerance (<300s window to prevent replay attacks)
SecRule REQUEST_URI "@beginsWith /v1/webhooks/" \
    "id:100002,phase:1,deny,status:400,log,msg:'Missing or expired X-PipeFish-Timestamp header'" \
    "chain"
    SecRule &REQUEST_HEADERS:X-PipeFish-Timestamp "@eq 0"

# Rule 3: Enforce JSON Content-Type on Agent Graph Execution
SecRule REQUEST_URI "@beginsWith /v1/graphs/" \
    "id:100003,phase:1,deny,status:415,log,msg:'Invalid Content-Type: application/json required'" \
    "chain"
    SecRule REQUEST_HEADERS:Content-Type "!@beginsWith application/json"

# Rule 4: Maximum JSON Payload Size Protection (Limit to 5MB to mitigate memory exhaustion)
SecRule REQUEST_HEADERS:Content-Length "@gt 5242880" \
    "id:100004,phase:1,deny,status:413,log,msg:'Payload size exceeds 5MB limit'"
