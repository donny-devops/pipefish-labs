[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipefish-labs"
version = "2.4.0"
description = "Enterprise AI automation, autonomous multi-agent orchestration, and zero-trust security platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "PipeFish Labs", email = "security@pipefishlabs.io" }
]
keywords = [
    "multi-agent",
    "autonomous-agents",
    "mcp",
    "model-context-protocol",
    "post-quantum-cryptography",
    "zero-trust",
    "mistral-handoffs"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]
mcp = [
    "mcp>=0.1.0"
]

[project.urls]
Homepage = "https://pipefishlabs.io"
Documentation = "https://pipefishlabs.io/sdk/"
Repository = "https://github.com/donny-devops/pipefish-labs"
Issues = "https://github.com/donny-devops/pipefish-labs/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
