[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdk*"]

[project]
name = "pipefish-labs"
version = "2.4.0"
description = "Enterprise AI automation, autonomous multi-agent orchestration, and zero-trust security platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "PipeFish Labs", email = "security@pipefishlabs.io" }
]
keywords = [
    "multi-agent",
    "autonomous-agents",
    "mcp",
    "model-context-protocol",
    "post-quantum-cryptography",
    "zero-trust",
    "mistral-handoffs"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "pydantic>=2.10.4",
    "cryptography>=44.0.1",
    "requests>=2.32.3",
    "urllib3>=2.3.0",
    "certifi>=2024.12.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0"
]
mcp = [
    "mcp>=1.2.0"
]

[project.urls]
Homepage = "https://pipefishlabs.io"
Documentation = "https://pipefishlabs.io/sdk/"
Repository = "https://github.com/donny-devops/pipefish-labs"
Issues = "https://github.com/donny-devops/pipefish-labs/issues"

[project.scripts]
pipefish = "sdk.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
