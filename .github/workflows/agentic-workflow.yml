name: "Autonomous Agentic Mesh Workflow"

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Select Multi-Agent Scenario to execute"
        required: true
        default: "codescan"
        type: choice
        options:
          - codescan
          - systemoptimizing
          - auditing
          - logtriage
          - receptionist
          - sales
          - observability
      task_description:
        description: "Task description or payload instruction"
        required: false
        default: "Execute autonomous system inspection and verification."
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agentic-execution:
    name: "Run PipeFish Agentic Mesh"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Execute Autonomous Agent Mesh
        id: run_agent
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCENARIO: ${{ github.event.inputs.scenario || 'codescan' }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title || github.event.inputs.task_description || 'CI/CD Automated Mesh Trigger' }}
          BODY: ${{ github.event.issue.body || github.event.pull_request.body || '' }}
        run: |
          python scripts/agentic_workflow_runner.py \
            --event-name "$EVENT_NAME" \
            --scenario "$SCENARIO" \
            --issue-title "$TITLE" \
            --issue-body "$BODY" \
            --output-file "agentic_report.md"

      # The reporting steps below run even when the agent step fails, so a
      # guardrail intercept (non-zero exit) still gets surfaced on the issue/PR.
      - name: Output Step Summary
        if: ${{ !cancelled() && hashFiles('agentic_report.md') != '' }}
        run: |
          cat agentic_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on Issue or Pull Request
        if: ${{ !cancelled() && hashFiles('agentic_report.md') != '' && (github.event_name == 'issues' || github.event_name == 'pull_request') }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('agentic_report.md', 'utf8');
            const issue_number = context.issue.number;
            if (issue_number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: report
              });
            }

      - name: Upload Agentic Report Artifact
        if: ${{ !cancelled() && hashFiles('agentic_report.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipefish-agentic-report
          path: agentic_report.md
          retention-days: 7
