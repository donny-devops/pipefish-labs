name: "Pre-Commit & CI/CD Secret Scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Gitleaks & Mistral API Key Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Scan for Mistral API Keys & Cloud Credentials
        run: |
          echo "Scanning codebase for exposed Mistral API keys (mk-*) and cloud credentials..."
          FOUND_SECRETS=0

          # Check for Mistral API Key pattern
          if grep -E -r "mk-[a-zA-Z0-9]{32,}" --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "::error::EXPOSED MISTRAL API KEY DETECTED!"
            FOUND_SECRETS=1
          fi

          # Check for AWS Access Key pattern
          if grep -E -r "AKIA[0-9A-Z]{16}" --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "::error::EXPOSED AWS ACCESS KEY DETECTED!"
            FOUND_SECRETS=1
          fi

          # Check for OpenSSH Private Keys
          if grep -E -r "-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----" --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "::error::EXPOSED PRIVATE KEY DETECTED!"
            FOUND_SECRETS=1
          fi

          if [ $FOUND_SECRETS -eq 1 ]; then
            echo "Secret scanning failed! Remove exposed credentials before pushing."
            exit 1
          fi
          echo "Secret scanning passed cleanly. Zero credentials exposed."
