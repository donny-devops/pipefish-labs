name: OpenAPI Specification Linting

on:
  push:
    paths:
      - 'sdk/openapi.yaml'
      - '.github/workflows/spectral-lint.yml'
  pull_request:
    paths:
      - 'sdk/openapi.yaml'

permissions:
  contents: read

jobs:
  spectral-lint:
    name: Lint OpenAPI 3.1 Contract (Spectral)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Spectral Linter
        uses: stoplightio/spectral-action@v0.8.10
        with:
          file_glob: 'sdk/openapi.yaml'
