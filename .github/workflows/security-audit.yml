name: Python & SDK Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-audit:
    name: pip-audit, bandit, npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install package and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=84.1.0"
          pip install -e ".[dev]"
          pip install pip-audit bandit

      - name: Run pip-audit
        run: pip-audit --skip-editable --progress-spinner off

      - name: Run bandit
        run: bandit -r sdk security bots -ll

      - name: Run npm audit (sdk)
        working-directory: ./sdk
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
