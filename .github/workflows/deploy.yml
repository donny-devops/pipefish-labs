name: Site Build & Deploy

# Cloudflare Workers Builds is connected to this repository and deploys on push
# to main using the build command in wrangler.jsonc. This workflow always
# verifies the build, and additionally deploys only when a Cloudflare API token
# is present, so the two paths cannot deploy over each other by accident.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.token.outputs.present }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site into dist/
        run: python scripts/build_site.py

      - name: Confirm no source files were published
        run: |
          leaked=$(find dist -type f \
            \( -name '*.py' -o -name '*.tf' -o -name '*.rego' -o -name '*.sql' \
               -o -name '*.env' -o -name '*.pem' -o -name '*.key' \))
          if [ -n "$leaked" ]; then
            echo "Refusing to deploy, non-public files present in dist/:"
            echo "$leaked"
            exit 1
          fi
          echo "dist/ contains $(find dist -type f | wc -l) publishable files."

      - name: Check whether a Cloudflare token is configured
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN set. Leaving the deploy to Workers Builds."
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: needs.build.outputs.can_deploy == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # wrangler.jsonc runs scripts/build_site.py as its build command, so this
      # deploys the freshly built dist/ without a separate build step.
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Provisioning a custom domain for the first time can take a couple of
      # minutes, so this polls rather than checking once.
      - name: Verify the site is serving
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://pipefishlabs.io/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "Site responded 200 on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: got HTTP $code, retrying in 15s."
            sleep 15
          done
          echo "Site did not return 200 within 3 minutes of deploying."
          exit 1
